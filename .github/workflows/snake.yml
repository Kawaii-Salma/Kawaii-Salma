name: Generate snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#ffc300&color_dots=#ebedf0,#fff1b8,#ffd84d,#ffc300,#b38600
            dist/snake-dark.svg?palette=github-dark&color_snake=#ffc300&color_dots=#161b22,#3d2e00,#7a5c00,#c99a00,#ffc300

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
